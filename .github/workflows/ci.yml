# Continuous integration: compile and run the full test suite on every push
# to master and on pull requests. Tests are headless-safe (no UI windows),
# so no display is needed on the runner.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Java 21 build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test (mvn verify)
        run: mvn -q verify
